buildscript {
    repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'

group = 'ivorius'
version = '1.20.1-port.3'
base { archivesName = 'psychedelicraft' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run/development')
            mods { psychedelicraft { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('run/gametest')
            property 'forge.enabledGameTestNamespaces', 'psychedelicrafttests'
            mods { psychedelicrafttests { source sourceSets.gameTest } }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.blamejared.com' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'junit:junit:4.13.2'
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.74.0.234')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.74.0.234')
    // Optional developer convenience; production clients may omit JEI completely.
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.74.0.234')
    }
}
mixin {
    add sourceSets.main, 'psychedelicraft.refmap.json'
    config 'psychedelicraft.mixins.json'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand version: project.version }
    from 'LICENSE'
}
jar.finalizedBy('reobfJar')
jar.manifest.attributes('MixinConfigs': 'psychedelicraft.mixins.json')
build.dependsOn(gameTestClasses)
