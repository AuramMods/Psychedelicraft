buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

apply plugin: 'net.minecraftforge.gradle'

group = 'ivorius'
version = '1.12.2-port.1'
archivesBaseName = 'psychedelicraft'
sourceCompatibility = targetCompatibility = '1.8'

def forgeVersion = '1.12.2-14.23.5.2864'
def mappingChannel = 'snapshot'
def mappingVersion = '20171003-1.12'

sourceSets {
    main {
        // Keep the 1.20.1 donor tree available while each feature is migrated.
        java.setSrcDirs(['src/forge/java'])
        resources.setSrcDirs(['src/forge/resources'])

        // Forge 1.12 discovers an exploded mod from a single output directory.
        def modOutput = file("$buildDir/sourceSets/main")
        output.resourcesDir = modOutput
        java.outputDir = modOutput
    }
}

minecraft {
    mappings channel: mappingChannel, version: mappingVersion

    runs {
        client {
            workingDirectory file('run/client')
            property 'fml.coreMods.load', 'ivorius.psychedelicraft.core.PsychedelicraftCore'
        }
        server {
            workingDirectory file('run/server')
            property 'fml.coreMods.load', 'ivorius.psychedelicraft.core.PsychedelicraftCore'
            args 'nogui'
        }
    }
}

repositories {
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeModule 'mezz.jei', 'jei_1.12.2' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forgeVersion}"
    compileOnly fg.deobf('mezz.jei:jei_1.12.2:4.16.1.302:api')
    testImplementation 'junit:junit:4.13.2'
}

tasks.register('resolveForgeSources') {
    group = 'forgegradle runs'
    description = 'Generate mapped Forge sources for a source-based development runtime.'
    doLast {
        def dependency = dependencies.create(
                "net.minecraftforge:forge:${forgeVersion}_mapped_${mappingChannel}_${mappingVersion}:sources@jar")
        def sources = configurations.detachedConfiguration(dependency)
        sources.transitive = false
        logger.lifecycle("Mapped Forge sources: ${sources.singleFile}")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching(['mcmod.info', 'version.properties']) {
        expand version: project.version
    }
    from 'LICENSE'
}

jar {
    manifest.attributes('FMLCorePlugin': 'ivorius.psychedelicraft.core.PsychedelicraftCore',
            'FMLCorePluginContainsFMLMod': 'true')
}

jar.finalizedBy('reobfJar')
