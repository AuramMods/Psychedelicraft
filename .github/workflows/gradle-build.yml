name: Build Forge port
on: [push, pull_request]
jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew --no-daemon build
      - run: ./gradlew --no-daemon runGameTestServer
      - name: Retain failed test evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-tests-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/test-results/
            run/gametest/logs/
            run/gametest/crash-reports/
            run/gametest/server.properties
            run/gametest/config/
            run/gametest/world/
